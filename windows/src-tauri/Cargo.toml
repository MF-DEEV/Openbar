[package]
name = "vorssaint-windows"
version = "0.1.0"
description = "Vorssaint Dynamic Island for Windows"
authors = ["Vorssaint"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vorssaint_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2"
memchr = "2"
regex = "1"
unicode-segmentation = "1"
getrandom = "0.3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
base64 = "0.22"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
rqrr = { version = "0.10.1", default-features = false }
sha2 = "0.10"
tauri-plugin-dialog = "2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs", "time"] }
time = { version = "0.3", features = ["local-offset"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Watch folds accents and widths out of what it reads (both already in the tree via url/idna).
icu_normalizer = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.4", default-features = false, features = ["compiled_data"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1"
widestring = "1"
webview2-com = "0.39"
# The `interface` and `implement` macros expand to `::windows_core` paths.
windows-core = "0.62"
windows-collections = "0.3"
windows = { version = "0.62", features = [
  "Win32_Networking_WinHttp",
  "ApplicationModel",
  "ApplicationModel_Appointments",
  "ApplicationModel_DataTransfer",
  "Data_Xml_Dom",
  "Foundation",
  "Foundation_Collections",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging",
  "Media",
  "Media_Control",
  "Media_Ocr",
  "Security_Authorization_AppCapabilityAccess",
  "Storage",
  "Storage_Streams",
  "System_Power",
  "UI",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Wdk_System_SystemInformation",
  "Win32_Devices_Bluetooth",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Display",
  "Win32_Devices_Properties",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_TaskScheduler",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_System_Variant",
  "Win32_System_WindowsProgramming",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_Wmi",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
